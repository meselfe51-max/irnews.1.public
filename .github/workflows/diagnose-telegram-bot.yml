name: Diagnose Telegram Bot

on:
  workflow_dispatch:
    inputs:
      admin_telegram_id:
        description: "Telegram numeric user ID to verify"
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PostgreSQL client
        run: npm install --no-save pg

      - name: Run detailed diagnostics
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_TELEGRAM_ID: ${{ inputs.admin_telegram_id }}
          WEBHOOK_URL: https://lifenews.vercel.app/api/telegram/webhook
        run: |
          node <<'NODE'
          const { Client } = require("pg");
          const token = process.env.TELEGRAM_BOT_TOKEN || "";
          const secret = process.env.TELEGRAM_WEBHOOK_SECRET || "";
          const databaseUrl = process.env.DATABASE_URL || "";
          const adminIdText = process.env.ADMIN_TELEGRAM_ID || "";
          const adminId = /^\\d+$/.test(adminIdText) ? Number(adminIdText) : NaN;
          const webhookUrl = process.env.WEBHOOK_URL;
          const failures = [];
          const warnings = [];
          const pass = (s) => console.log("PASS  " + s);
          const fail = (s) => { console.log("FAIL  " + s); failures.push(s); };
          const warn = (s) => { console.log("WARN  " + s); warnings.push(s); };

          async function telegram(method, body = {}) {
            const response = await fetch(`https://api.telegram.org/bot${token}/${method}`, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify(body)
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || !data.ok) throw new Error(data.description || `HTTP ${response.status}`);
            return data.result;
          }

          async function main() {
            console.log("=== LIFE NEWS: DETAILED TELEGRAM DIAGNOSTICS ===");
            console.log("Secrets are never printed. Only presence and test results are reported.");

            if (!token) fail("GitHub Actions secret TELEGRAM_BOT_TOKEN is missing.");
            if (!secret) fail("GitHub Actions secret TELEGRAM_WEBHOOK_SECRET is missing.");
            if (!databaseUrl) fail("GitHub Actions secret DATABASE_URL is missing.");
            if (!Number.isSafeInteger(adminId) || adminId <= 0) fail("Input admin_telegram_id is not a valid positive numeric Telegram ID.");
            if (failures.length) throw new Error("Cannot continue until the missing/invalid GitHub inputs above are fixed.");

            // A. Read the safe, per-variable configuration status from production.
            let production = null;
            try {
              const response = await fetch(webhookUrl, { cache: "no-store" });
              const data = await response.json().catch(() => ({}));
              if (!response.ok || data.service !== "Life News Telegram webhook" || !data.diagnostics) {
                fail(`Production diagnostic endpoint is not the updated version (HTTP ${response.status}). Redeploy the latest private-repository commit, then rerun this workflow.`);
              } else {
                production = data.diagnostics;
                pass("Production webhook endpoint is reachable.");
                for (const [key, label] of [
                  ["botTokenConfigured", "TELEGRAM_BOT_TOKEN"],
                  ["webhookSecretConfigured", "TELEGRAM_WEBHOOK_SECRET"],
                  ["databaseUrlConfigured", "DATABASE_URL"],
                  ["adminTelegramIdConfigured", "ADMIN_TELEGRAM_ID"]
                ]) {
                  if (production[key] === true) pass(`Vercel Production has ${label} set.`);
                  else fail(`Vercel Production is missing ${label}. Add it under Project → Settings → Environment Variables, enable Production, then redeploy.`);
                }
              }
            } catch (e) {
              fail("Could not read the production diagnostic endpoint: " + e.message);
            }

            // B. Verify the GitHub bot token and inspect Telegram's actual webhook status.
            let bot = null;
            let webhookInfo = null;
            try {
              bot = await telegram("getMe");
              pass(`GitHub TELEGRAM_BOT_TOKEN is valid for @${bot.username} (bot ID ${bot.id}).`);
              webhookInfo = await telegram("getWebhookInfo");
              if (webhookInfo.url === webhookUrl) pass("Telegram is pointing to the expected production webhook URL.");
              else fail(`Telegram webhook URL is different. Expected ${webhookUrl}; currently registered: ${webhookInfo.url || "(empty)"}.`);
              console.log("Telegram pending_update_count: " + (webhookInfo.pending_update_count ?? "unknown"));
              if (webhookInfo.max_connections != null) console.log("Telegram max_connections: " + webhookInfo.max_connections);
              if (webhookInfo.allowed_updates) console.log("Telegram allowed_updates: " + JSON.stringify(webhookInfo.allowed_updates));
              if (webhookInfo.last_error_message) {
                fail(`Telegram's latest webhook delivery failed at ${webhookInfo.last_error_date ? new Date(webhookInfo.last_error_date * 1000).toISOString() : "unknown time"}: ${webhookInfo.last_error_message}`);
              } else pass("Telegram reports no recent webhook delivery error.");
              if ((webhookInfo.pending_update_count || 0) > 0) warn("Telegram has queued updates; they may be retried after the webhook problem is fixed.");
            } catch (e) {
              fail("Telegram API check failed using the GitHub bot token: " + e.message);
            }

            // C. Compare the GitHub secret to production by sending a harmless authenticated probe.
            // HTTP 401 plus the per-variable status distinguishes mismatch from a missing Vercel secret.
            if (production?.webhookSecretConfigured === true) {
              try {
                const response = await fetch(webhookUrl, {
                  method: "POST",
                  headers: {
                    "content-type": "application/json",
                    "x-telegram-bot-api-secret-token": secret
                  },
                  body: JSON.stringify({ update_id: 900000000, message: {
                    message_id: 900000000,
                    from: { id: adminId, is_bot: false, first_name: "Diagnostic" },
                    chat: { id: adminId, type: "private" },
                    date: Math.floor(Date.now() / 1000),
                    text: "/start"
                  }}),
                  cache: "no-store"
                });
                const body = await response.text();
                if (response.status === 401) {
                  fail("GitHub TELEGRAM_WEBHOOK_SECRET does NOT match the secret currently loaded by Vercel Production. Copy the exact same value into GitHub Actions repository secret, then redeploy Vercel.");
                } else if (response.status === 200) {
                  pass("GitHub TELEGRAM_WEBHOOK_SECRET matches Vercel; production accepted the authenticated probe.");
                  if (body && !body.includes('"ok":true')) warn("Webhook returned HTTP 200 but its response body was unexpected: " + body.slice(0,180));
                  else pass("Webhook returned a successful JSON response.");
                  warn("The probe used /start and may have sent one diagnostic message to the supplied Telegram ID.");
                } else if (response.status >= 500) {
                  fail(`Secret was accepted, but production webhook crashed with HTTP ${response.status}. Inspect Vercel → Logs for the matching function invocation.`);
                  console.log("Webhook response excerpt: " + body.slice(0,250));
                } else {
                  fail(`Authenticated webhook probe returned unexpected HTTP ${response.status}. Response: ${body.slice(0,250)}`);
                }
              } catch (e) {
                fail("Could not run authenticated production webhook probe: " + e.message);
              }
            } else {
              warn("Secret comparison skipped because Vercel reports TELEGRAM_WEBHOOK_SECRET is missing.");
            }

            // D. Check the exact admin row in the same database used by this diagnostic.
            const client = new Client({
              connectionString: databaseUrl,
              ssl: { rejectUnauthorized: false },
              connectionTimeoutMillis: 10000
            });
            try {
              await client.connect();
              pass("GitHub DATABASE_URL successfully connected to PostgreSQL.");
              const result = await client.query(
                "SELECT id, enabled, role FROM admins WHERE telegram_id = $1 ORDER BY id LIMIT 1",
                [adminId]
              );
              if (!result.rows.length) {
                fail(`Telegram ID ${adminId} has no row in admins. Sign in once at /admin/login using this ID and the Vercel ADMIN_PASSWORD to bootstrap the owner, then rerun.`);
              } else {
                const row = result.rows[0];
                if (row.enabled !== true) fail(`Admin row exists (id ${row.id}) but enabled=false. Enable the account before testing commands.`);
                else pass(`Telegram ID ${adminId} exists and is enabled (role: ${row.role}).`);
              }
            } catch (e) {
              fail("Database/admin check failed: " + e.message);
            } finally {
              try { await client.end(); } catch {}
            }

            // E. Final diagnosis.
            console.log("");
            console.log("=== DIAGNOSTIC RESULT ===");
            console.log("Failures: " + failures.length + " | Warnings: " + warnings.length);
            if (failures.length) {
              console.log("RESULT: NOT READY. Fix each FAIL item; do not rotate secrets again unless instructed.");
              process.exitCode = 1;
            } else {
              console.log("RESULT: AUTOMATED CHECKS PASSED. Send /start to the bot in Telegram. If it still does not reply, inspect Vercel Function Logs for the exact request timestamp.");
            }
          }
          main().catch(e => { console.error("Diagnostic runner error:", e.message); process.exit(1); });
          NODE
