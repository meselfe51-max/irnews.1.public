
name: Test News RSS

on:
  workflow_dispatch:

jobs:
  test-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests feedparser lxml beautifulsoup4

      - name: Discover Tasnim RSS feeds
        id: tasnim
        run: |
          python - <<'PY'
          import requests
          import feedparser
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse
          import re

          page_url = "https://www.tasnimnews.ir/fa/rss"
          headers = {"User-Agent": "Mozilla/5.0"}

          candidates = set()

          try:
              response = requests.get(
                  page_url,
                  headers=headers,
                  timeout=30
              )
              response.raise_for_status()

              soup = BeautifulSoup(response.text, "html.parser")

              print("PAGE TITLE:",
                    soup.title.get_text(strip=True) if soup.title else "N/A")

              print("\nDISCOVERED LINKS:")

              for tag in soup.find_all(["a", "link"]):
                  href = tag.get("href", "")
                  text = tag.get_text(" ", strip=True)
                  rel = tag.get("rel", [])

                  if not href:
                      continue

                  if (
                      "rss" in href.lower()
                      or "feed" in href.lower()
                      or "xml" in href.lower()
                      or "rss" in text.lower()
                      or "rss" in " ".join(rel).lower()
                  ):
                      candidates.add(urljoin(page_url, href))

              print("\nTESTING DISCOVERED FEEDS:")

              valid = []

              for url in sorted(candidates):
                  try:
                      r = requests.get(
                          url,
                          headers=headers,
                          timeout=20
                      )

                      feed = feedparser.parse(r.content)

                      is_xml = (
                          "xml" in r.headers.get("Content-Type", "").lower()
                          or r.content.lstrip().startswith(b"<?xml")
                          or b"<rss" in r.content[:1000].lower()
                          or b"<feed" in r.content[:1000].lower()
                      )

                      if (
                          r.status_code == 200
                          and is_xml
                          and len(feed.entries) > 0
                      ):
                          valid.append(url)
                          print("\nVALID RSS:", url)
                          print("Entries:", len(feed.entries))
                          print("Latest:", feed.entries[0].get("title", "N/A"))
                      else:
                          print("\nINVALID:", url)
                          print("HTTP:", r.status_code)
                          print("Content-Type:",
                                r.headers.get("Content-Type"))
                          print("Entries:", len(feed.entries))

                  except Exception as e:
                      print("\nERROR:", url, repr(e))

              if valid:
                  selected = valid[0]
                  print("\nSELECTED TAS NIM RSS:", selected)
                  with open("tasnim_rss.txt", "w") as f:
                      f.write(selected)
              else:
                  print("\nNo valid RSS feed discovered.")
                  open("tasnim_rss.txt", "w").close()

          except Exception as e:
              print("DISCOVERY FAILED:", repr(e))
              open("tasnim_rss.txt", "w").close()
          PY

      - name: Test RSS feeds
        run: |
          python - <<'PY'
          import requests
          import feedparser
          import re
          import os

          FEEDS = {
              "IRNA": "https://www.irna.ir/rss",
              "ISNA": "https://www.isna.ir/rss",
              "Mehr": "https://www.mehrnews.com/rss",
              "Fars": "https://farsnews.ir/rss",
              "Khabaronline": "https://www.khabaronline.ir/rss",
          }

          if os.path.exists("tasnim_rss.txt"):
              with open("tasnim_rss.txt") as f:
                  tasnim_url = f.read().strip()

              if tasnim_url:
                  FEEDS["Tasnim"] = tasnim_url

          headers = {
              "User-Agent": "Mozilla/5.0 (compatible; RSSChecker/1.0)"
          }

          success = 0
          failed = 0

          def find_image(entry):
              for field in ("media_content", "media_thumbnail"):
                  for item in entry.get(field, []):
                      if item.get("url"):
                          return item["url"]

              for link in entry.get("links", []):
                  if link.get("type", "").startswith("image/"):
                      return link.get("href")

              for enclosure in entry.get("enclosures", []):
                  if enclosure.get("type", "").startswith("image/"):
                      return enclosure.get("href")

              content = entry.get("summary", "")
              match = re.search(
                  r'<img[^>]+src=["\']([^"\']+)["\']',
                  content,
                  re.IGNORECASE
              )

              return match.group(1) if match else None

          for name, url in FEEDS.items():
              print("\n" + "=" * 55)
              print("Testing:", name)
              print("URL:", url)

              try:
                  response = requests.get(
                      url,
                      headers=headers,
                      timeout=25
                  )

                  print("HTTP Status:", response.status_code)
                  response.raise_for_status()

                  content_type = response.headers.get(
                      "Content-Type", ""
                  ).lower()

                  if "html" in content_type:
                      raise Exception("Server returned HTML instead of RSS")

                  feed = feedparser.parse(response.content)

                  if not feed.entries:
                      raise Exception(
                          str(feed.get("bozo_exception", "No RSS entries"))
                      )

                  print("RSS: VALID")
                  print("Entries:", len(feed.entries))

                  latest = feed.entries[0]

                  print("Latest title:", latest.get("title", "N/A"))
                  print("Latest link:", latest.get("link", "N/A"))
                  print("Published:", latest.get("published", "N/A"))
                  print("Image URL:", find_image(latest) or "NOT FOUND")

                  success += 1
                  print("RESULT: SUCCESS")

              except Exception as error:
                  failed += 1
                  print("RESULT: FAILED")
                  print("Error:", repr(error))

          print("\n" + "=" * 55)
          print("FINAL SUMMARY")
          print("Successful sources:", success)
          print("Failed sources:", failed)
          print("Total tested:", success + failed)
          print("=" * 55)
          PY
