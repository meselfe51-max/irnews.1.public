```yaml
name: Test News RSS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-rss:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests feedparser beautifulsoup4

      - name: Discover and test all RSS feeds
        run: |
          python - <<'PY'
          import requests
          import feedparser
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse
          from collections import Counter
          import re

          SOURCES = {
              "IRNA": "https://www.irna.ir/rss",
              "ISNA": "https://www.isna.ir/rss",
              "Mehr": "https://www.mehrnews.com/rss",
              "Tasnim": "https://www.tasnimnews.ir/fa/rss",
              "Khabaronline": "https://www.khabaronline.ir/rss",
          }

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (compatible; NewsRSSChecker/2.0)"
          }

          MAX_FEEDS_PER_SOURCE = 25
          TIMEOUT = 25

          session = requests.Session()
          session.headers.update(HEADERS)

          total_valid = 0
          total_invalid = 0
          total_categories = 0

          def normalize_url(url):
              parsed = urlparse(url)
              return parsed._replace(fragment="").geturl().rstrip("/")

          def get_category_labels(entry):
              labels = []

              for tag in entry.get("tags", []):
                  value = tag.get("term", "")
                  if value:
                      labels.append(value.strip())

              for field in ("category", "dc_subject"):
                  value = entry.get(field)

                  if isinstance(value, str) and value.strip():
                      labels.append(value.strip())

              return list(dict.fromkeys(labels))

          def is_xml_feed(response):
              content = response.content.lstrip()[:2000].lower()
              content_type = response.headers.get(
                  "Content-Type", ""
              ).lower()

              if "text/html" in content_type:
                  return False

              return (
                  "xml" in content_type
                  or content.startswith(b"<?xml")
                  or b"<rss" in content
                  or b"<feed" in content
                  or b"<rdf:rdf" in content
              )

          def discover_links(page_url, html):
              soup = BeautifulSoup(html, "html.parser")
              candidates = {}

              for tag in soup.find_all(["a", "link"]):
                  href = tag.get("href", "").strip()

                  if not href:
                      continue

                  text = tag.get_text(" ", strip=True)
                  rel = tag.get("rel", [])

                  if isinstance(rel, str):
                      rel = [rel]

                  searchable = (
                      href.lower() + " " +
                      text.lower() + " " +
                      " ".join(rel).lower()
                  )

                  is_candidate = (
                      "rss" in searchable
                      or "feed" in searchable
                      or ".xml" in searchable
                      or "خوراک" in searchable
                  )

                  if not is_candidate:
                      continue

                  url = normalize_url(urljoin(page_url, href))

                  if urlparse(url).scheme not in ("http", "https"):
                      continue

                  if url == normalize_url(page_url):
                      continue

                  candidates[url] = text or "عنوان نامشخص"

              return candidates

          def inspect_feed(source, label, url):
              global total_valid, total_invalid, total_categories

              print("\n" + "-" * 70)
              print("SOURCE:", source)
              print("FEED LABEL:", label)
              print("URL:", url)

              try:
                  response = session.get(url, timeout=TIMEOUT)
                  print("HTTP:", response.status_code)
                  print("Content-Type:",
                        response.headers.get("Content-Type", "N/A"))

                  response.raise_for_status()

                  if not is_xml_feed(response):
                      print("RESULT: INVALID - Not an XML RSS/Atom feed")
                      total_invalid += 1
                      return

                  feed = feedparser.parse(response.content)

                  if not feed.entries:
                      print("RESULT: INVALID - No entries")
                      if feed.get("bozo_exception"):
                          print("PARSER ERROR:", feed.bozo_exception)
                      total_invalid += 1
                      return

                  total_valid += 1
                  print("RESULT: VALID")
                  print("ENTRIES:", len(feed.entries))

                  category_counter = Counter()

                  for entry in feed.entries:
                      for category in get_category_labels(entry):
                          category_counter[category] += 1

                  if category_counter:
                      total_categories += 1
                      print("\nCATEGORIES FOUND IN RSS:")

                      for category, count in category_counter.most_common(20):
                          print(f"  - {category}: {count}")
                  else:
                      print("\nCATEGORIES FOUND IN RSS: NONE")

                  print("\nSAMPLE ARTICLES:")

                  for entry in feed.entries[:3]:
                      print("  TITLE:", entry.get("title", "N/A"))
                      print("  LINK:", entry.get("link", "N/A"))

                      categories = get_category_labels(entry)
                      print("  CATEGORIES:",
                            ", ".join(categories) if categories else "NONE")

              except Exception as error:
                  total_invalid += 1
                  print("RESULT: ERROR")
                  print("ERROR:", repr(error))

          for source, page_url in SOURCES.items():
              print("\n\n" + "=" * 70)
              print("DISCOVERING:", source)
              print("PAGE:", page_url)
              print("=" * 70)

              try:
                  page_response = session.get(
                      page_url,
                      timeout=TIMEOUT
                  )

                  print("DISCOVERY HTTP:", page_response.status_code)
                  page_response.raise_for_status()

                  candidates = discover_links(
                      page_response.url,
                      page_response.text
                  )

                  print("DISCOVERED CATEGORY/FEED LINKS:",
                        len(candidates))

                  for label, url in list(candidates.items())[
                      :MAX_FEEDS_PER_SOURCE
                  ]:
                      print("  -", label, "=>", url)

                  # Test the main feed first.
                  inspect_feed(source, "MAIN RSS", page_response.url)

                  # Test every discovered feed separately.
                  for url, label in list(candidates.items())[
                      :MAX_FEEDS_PER_SOURCE
                  ]:
                      inspect_feed(source, label, url)

              except Exception as error:
                  print("DISCOVERY FAILED:", source, repr(error))
                  total_invalid += 1

          print("\n\n" + "=" * 70)
          print("FINAL SUMMARY")
          print("=" * 70)
          print("VALID FEEDS:", total_valid)
          print("INVALID FEEDS:", total_invalid)
          print("FEEDS CONTAINING CATEGORY METADATA:", total_categories)
          print("TOTAL TESTED:", total_valid + total_invalid)
          print("=" * 70)
          PY
```
