
name: Test RSS Sources

on:
  workflow_dispatch:

jobs:
  test-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Test RSS feeds
        run: |
          python - <<'PY'
          import requests
          import feedparser
          from datetime import datetime, timezone

          feeds = {
              "IRNA": "https://www.irna.ir/rss",
              "ISNA": "https://www.isna.ir/rss",
              "Mehr": "https://www.mehrnews.com/rss",
              "Tasnim": "https://www.tasnimnews.ir/fa/rss",,
              "Fars": "https://www.farsnews.ir/rss",
              "Khabaronline": "https://www.khabaronline.ir/rss"
          }

          headers = {
              "User-Agent": "Mozilla/5.0 (compatible; NewsRSSBot/1.0)"
          }

          for name, url in feeds.items():
              print("\n" + "=" * 50)
              print("SOURCE:", name)

              try:
                  response = requests.get(
                      url,
                      headers=headers,
                      timeout=25
                  )

                  print("HTTP Status:", response.status_code)
                  print("Response Size:", len(response.content), "bytes")

                  response.raise_for_status()

                  feed = feedparser.parse(response.content)

                  if feed.bozo and not feed.entries:
                      print("RESULT: INVALID RSS")
                      print("Error:", feed.bozo_exception)
                      continue

                  print("RSS Valid:", not feed.bozo)
                  print("News Found:", len(feed.entries))

                  if feed.entries:
                      latest = feed.entries[0]

                      print("Latest Title:", latest.get("title", "N/A"))
                      print("Latest Link:", latest.get("link", "N/A"))
                      print("Published:", latest.get("published", "N/A"))

                      image = None

                      for link in latest.get("links", []):
                          if link.get("type", "").startswith("image/"):
                              image = link.get("href")
                              break

                      if not image:
                          image = latest.get("image", {}).get("href")

                      print("Image URL:", image or "Not found")

                  else:
                      print("RESULT: NO NEWS FOUND")

              except Exception as error:
                  print("RESULT: FAILED")
                  print("Error:", str(error))
          PY
