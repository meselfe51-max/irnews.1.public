
name: Test News RSS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-rss:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests feedparser beautifulsoup4

      - name: Discover and test RSS feeds
        run: |
          python - <<'PY'
          import requests
          import feedparser
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse, urldefrag
          from collections import Counter
          from datetime import datetime, timezone
          import re

          SOURCES = {
              "IRNA": {
                  "main": "https://www.irna.ir/rss",
                  "home": "https://www.irna.ir/",
              },
              "ISNA": {
                  "main": "https://www.isna.ir/rss",
                  "home": "https://www.isna.ir/",
              },
              "Mehr": {
                  "main": "https://www.mehrnews.com/rss",
                  "home": "https://www.mehrnews.com/",
              },
              "Tasnim": {
                  "main": "https://www.tasnimnews.ir/fa/rss",
                  "home": "https://www.tasnimnews.ir/fa",
              },
              "Khabaronline": {
                  "main": "https://www.khabaronline.ir/rss",
                  "home": "https://www.khabaronline.ir/",
              },
          }

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (compatible; NewsRSSChecker/2.0)"
              )
          }

          TIMEOUT = 25
          MAX_DISCOVERED_FEEDS = 25

          session = requests.Session()
          session.headers.update(HEADERS)

          tested_urls = set()
          valid_feeds = 0
          invalid_feeds = 0
          feeds_with_categories = 0

          def clean_url(url):
              url, _ = urldefrag(url)
              return url.rstrip("/")

          def is_feed(response):
              content = response.content.lstrip()
              content_type = response.headers.get(
                  "Content-Type", ""
              ).lower()

              if "text/html" in content_type:
                  return False

              if (
                  "xml" in content_type
                  or "rss" in content_type
                  or "atom" in content_type
              ):
                  return True

              sample = content[:2000].lower()

              return (
                  sample.startswith(b"<?xml")
                  or sample.startswith(b"<rss")
                  or sample.startswith(b"<feed")
                  or b"<rss" in sample
                  or b"<feed" in sample
                  or b"<rdf:rdf" in sample
              )

          def get_categories(entry):
              result = []

              for tag in entry.get("tags", []):
                  value = tag.get("term", "")

                  if value and value.strip():
                      result.append(value.strip())

              for field in ("category", "dc_subject"):
                  value = entry.get(field)

                  if isinstance(value, str) and value.strip():
                      result.append(value.strip())

                  elif isinstance(value, list):
                      for item in value:
                          if isinstance(item, str) and item.strip():
                              result.append(item.strip())

              return list(dict.fromkeys(result))

          def discover_links(page_url, html):
              soup = BeautifulSoup(html, "html.parser")
              candidates = {}

              # Standard RSS/Atom alternate links
              for tag in soup.find_all("link"):
                  rel = tag.get("rel", [])
                  if isinstance(rel, str):
                      rel = [rel]

                  link_type = tag.get("type", "").lower()

                  if (
                      "alternate" in rel
                      and (
                          "rss" in link_type
                          or "atom" in link_type
                          or "xml" in link_type
                      )
                  ):
                      href = tag.get("href", "")

                      if href:
                          url = clean_url(urljoin(page_url, href))
                          candidates[url] = tag.get("title", "RSS alternate")

              # RSS links in page navigation
              for tag in soup.find_all("a", href=True):
                  href = tag.get("href", "").strip()
                  text = tag.get_text(" ", strip=True)

                  searchable = (href + " " + text).lower()

                  if not any(
                      word in searchable
                      for word in (
                          "rss", "feed", ".xml", "خوراک"
                      )
                  ):
                      continue

                  url = clean_url(urljoin(page_url, href))

                  if urlparse(url).scheme not in ("http", "https"):
                      continue

                  if urlparse(url).netloc != urlparse(page_url).netloc:
                      continue

                  candidates.setdefault(
                      url,
                      text or "RSS link"
                  )

              return candidates

          def find_image(entry):
              for field in ("media_content", "media_thumbnail"):
                  for item in entry.get(field, []):
                      url = item.get("url")
                      if url:
                          return url

              for enclosure in entry.get("enclosures", []):
                  if enclosure.get("type", "").startswith("image/"):
                      return enclosure.get("href")

              summary = entry.get("summary", "")
              soup = BeautifulSoup(summary, "html.parser")
              image = soup.find("img")

              if image:
                  return image.get("src")

              return None

          def test_feed(source, label, url):
              global valid_feeds
              global invalid_feeds
              global feeds_with_categories

              url = clean_url(url)

              if url in tested_urls:
                  print("\nSKIPPED DUPLICATE:", url)
                  return

              tested_urls.add(url)

              print("\n" + "=" * 65)
              print("SOURCE:", source)
              print("FEED:", label)
              print("URL:", url)

              try:
                  response = session.get(
                      url,
                      timeout=TIMEOUT,
                      allow_redirects=True
                  )

                  print("HTTP:", response.status_code)
                  print(
                      "CONTENT TYPE:",
                      response.headers.get("Content-Type", "N/A")
                  )
                  print("FINAL URL:", response.url)

                  response.raise_for_status()

                  if not is_feed(response):
                      print("RESULT: INVALID - HTML or non-XML response")
                      invalid_feeds += 1
                      return

                  feed = feedparser.parse(response.content)

                  if not feed.entries:
                      print("RESULT: INVALID - No feed entries")

                      if feed.get("bozo_exception"):
                          print("PARSER ERROR:", feed.bozo_exception)

                      invalid_feeds += 1
                      return

                  valid_feeds += 1

                  print("RESULT: VALID")
                  print("ENTRIES:", len(feed.entries))

                  category_counts = Counter()

                  for entry in feed.entries:
                      for category in get_categories(entry):
                          category_counts[category] += 1

                  if category_counts:
                      feeds_with_categories += 1

                      print("\nRSS CATEGORIES:")

                      for category, count in category_counts.most_common(30):
                          print(f"  {category}: {count}")

                  else:
                      print("\nRSS CATEGORIES: NOT FOUND")

                  print("\nSAMPLE ARTICLES:")

                  for entry in feed.entries[:3]:
                      print("\nTITLE:", entry.get("title", "N/A"))
                      print("LINK:", entry.get("link", "N/A"))
                      print("PUBLISHED:", entry.get("published", "N/A"))

                      categories = get_categories(entry)

                      print(
                          "ARTICLE CATEGORIES:",
                          ", ".join(categories) if categories else "NONE"
                      )

                      print("IMAGE:", find_image(entry) or "NOT FOUND")

              except Exception as error:
                  invalid_feeds += 1
                  print("RESULT: FAILED")
                  print("ERROR:", repr(error))

          for source, config in SOURCES.items():
              print("\n\n" + "#" * 70)
              print("DISCOVERING SOURCE:", source)
              print("#" * 70)

              discovered = {}

              # Try the main RSS URL.
              try:
                  response = session.get(
                      config["main"],
                      timeout=TIMEOUT,
                      allow_redirects=True
                  )

                  print("\nMAIN URL:", config["main"])
                  print("HTTP:", response.status_code)

                  response.raise_for_status()

                  if is_feed(response):
                      test_feed(source, "MAIN RSS", config["main"])
                  else:
                      print("MAIN URL IS NOT A FEED; CHECKING AS HTML PAGE")

                      discovered.update(
                          discover_links(response.url, response.text)
                      )

              except Exception as error:
                  print("MAIN URL ERROR:", repr(error))

              # Inspect the homepage for RSS alternate/category links.
              try:
                  home_response = session.get(
                      config["home"],
                      timeout=TIMEOUT,
                      allow_redirects=True
                  )

                  home_response.raise_for_status()

                  if "html" in home_response.headers.get(
                      "Content-Type", ""
                  ).lower():
                      discovered.update(
                          discover_links(
                              home_response.url,
                              home_response.text
                          )
                      )

              except Exception as error:
                  print("HOMEPAGE DISCOVERY ERROR:", repr(error))

              print("\nDISCOVERED FEED LINKS:", len(discovered))

              for url, label in list(discovered.items())[
                  :MAX_DISCOVERED_FEEDS
              ]:
                  print("DISCOVERED:", label, "=>", url)

              # Test every discovered feed independently.
              for url, label in list(discovered.items())[
                  :MAX_DISCOVERED_FEEDS
              ]:
                  test_feed(source, label, url)

              # Report if no usable feed was discovered or tested.
              if not discovered and config["main"] not in tested_urls:
                  print("\nNO FEED COULD BE TESTED FOR:", source)

          print("\n\n" + "#" * 70)
          print("FINAL SUMMARY")
          print("#" * 70)
          print("VALID FEEDS:", valid_feeds)
          print("INVALID FEEDS:", invalid_feeds)
          print("FEEDS WITH CATEGORY METADATA:", feeds_with_categories)
          print("UNIQUE URLS TESTED:", len(tested_urls))
          print("#" * 70)
          PY
