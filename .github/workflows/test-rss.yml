
name: Test News RSS

on:
  workflow_dispatch:

jobs:
  test-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests feedparser lxml

      - name: Diagnose Tasnim RSS
        run: |
          python - <<'PY'
          import requests
          import feedparser
          from lxml import etree

          url = "https://www.tasnimnews.ir/fa/rss"

          try:
              r = requests.get(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"},
                  timeout=30
              )

              print("HTTP:", r.status_code)
              print("Content-Type:", r.headers.get("Content-Type"))
              print("Final URL:", r.url)
              print("Response size:", len(r.content))
              print("\nRAW RESPONSE:")
              print(r.text[:1500])

              r.raise_for_status()

              feed = feedparser.parse(r.content)

              print("\nDIRECT PARSE:")
              print("Entries:", len(feed.entries))
              print("Error:", feed.get("bozo_exception"))

              parser = etree.XMLParser(
                  recover=True,
                  encoding="utf-8"
              )

              root = etree.fromstring(r.content, parser)

              if root is not None:
                  repaired = etree.tostring(
                      root,
                      encoding="utf-8",
                      xml_declaration=True
                  )

                  result = feedparser.parse(repaired)

                  print("\nREPAIRED PARSE:")
                  print("Entries:", len(result.entries))

                  for entry in result.entries[:5]:
                      print("-", entry.get("title", "NO TITLE"))
              else:
                  print("XML RECOVERY FAILED")

          except Exception as e:
              print("TASNIM DIAGNOSTIC ERROR:", repr(e))
          PY

      - name: Test RSS feeds
        run: |
          python - <<'PY'
          import requests
          import feedparser
          import re

          FEEDS = {
              "IRNA": "https://www.irna.ir/rss",
              "ISNA": "https://www.isna.ir/rss",
              "Mehr": "https://www.mehrnews.com/rss",
              "Tasnim": "https://www.tasnimnews.ir/fa/rss",
              "Fars": "https://farsnews.ir/rss",
              "Khabaronline": "https://www.khabaronline.ir/rss",
          }

          headers = {
              "User-Agent": "Mozilla/5.0 (compatible; RSSChecker/1.0)"
          }

          success = 0
          failed = 0

          def find_image(entry):
              for field in ("media_content", "media_thumbnail"):
                  for item in entry.get(field, []):
                      if item.get("url"):
                          return item["url"]

              for link in entry.get("links", []):
                  if link.get("type", "").startswith("image/"):
                      return link.get("href")

              for enclosure in entry.get("enclosures", []):
                  if enclosure.get("type", "").startswith("image/"):
                      return enclosure.get("href")

              content = entry.get("summary", "")
              match = re.search(
                  r'<img[^>]+src=["\']([^"\']+)["\']',
                  content,
                  re.IGNORECASE
              )

              return match.group(1) if match else None

          for name, url in FEEDS.items():
              print("\n" + "=" * 55)
              print("Testing:", name)
              print("URL:", url)

              try:
                  response = requests.get(
                      url,
                      headers=headers,
                      timeout=25
                  )

                  print("HTTP Status:", response.status_code)
                  response.raise_for_status()

                  feed = feedparser.parse(response.content)

                  if feed.bozo and not feed.entries:
                      raise Exception(str(feed.bozo_exception))

                  if not feed.entries:
                      raise Exception("No RSS entries found")

                  if feed.bozo:
                      print("WARNING: XML parsing issue:", feed.bozo_exception)

                  print("RSS: VALID")
                  print("Entries:", len(feed.entries))

                  latest = feed.entries[0]

                  print("Latest title:", latest.get("title", "N/A"))
                  print("Latest link:", latest.get("link", "N/A"))
                  print("Published:", latest.get("published", "N/A"))

                  image = find_image(latest)
                  print("Image URL:", image or "NOT FOUND")

                  success += 1
                  print("RESULT: SUCCESS")

              except Exception as error:
                  failed += 1
                  print("RESULT: FAILED")
                  print("Error:", repr(error))

          print("\n" + "=" * 55)
          print("FINAL SUMMARY")
          print("Successful sources:", success)
          print("Failed sources:", failed)
          print("Total sources:", len(FEEDS))
          print("=" * 55)

          if success == 0:
              raise SystemExit("All RSS sources failed.")
          PY
