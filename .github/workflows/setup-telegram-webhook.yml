name: Setup Telegram Webhook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Register and verify Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          node <<'NODE'
          const url = "https://lifenews.vercel.app/api/telegram/webhook";
          const token = process.env.TELEGRAM_BOT_TOKEN;
          const secret = process.env.TELEGRAM_WEBHOOK_SECRET;

          if (!token || !secret) {
            console.error("Missing repository secrets: TELEGRAM_BOT_TOKEN and/or TELEGRAM_WEBHOOK_SECRET.");
            process.exit(1);
          }
          if (secret.length < 1 || secret.length > 256 || !/^[A-Za-z0-9_-]+$/.test(secret)) {
            console.error("TELEGRAM_WEBHOOK_SECRET must contain 1–256 characters: A-Z, a-z, 0-9, _ or -.");
            process.exit(1);
          }

          async function telegram(method, body) {
            const response = await fetch(`https://api.telegram.org/bot${token}/${method}`, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify(body)
            });
            const data = await response.json();
            if (!response.ok || !data.ok) {
              throw new Error(`${method} failed (HTTP ${response.status}): ${data.description || "Telegram API error"}`);
            }
            return data.result;
          }

          (async () => {
            await telegram("setWebhook", {
              url,
              secret_token: secret,
              allowed_updates: ["message", "callback_query"],
              drop_pending_updates: false
            });
            console.log("Telegram accepted the webhook registration.");

            const info = await telegram("getWebhookInfo", {});
            if (info.url !== url) {
              throw new Error("Webhook verification failed: Telegram reports a different URL.");
            }
            console.log("Webhook URL verified:", info.url);
            console.log("Pending updates:", info.pending_update_count ?? 0);
            if (info.last_error_message) {
              console.log("Telegram's latest delivery error:", info.last_error_message);
            } else {
              console.log("No recent Telegram delivery error is reported.");
            }
          })().catch(error => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
