name: Probe Historical Category Metadata

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/probe-archive-api.mjs'
      - '.github/workflows/probe-archive-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Probe official ISNA service feeds
        run: node scripts/probe-archive-api.mjs
