name: Trigger Life News automatic rewrite

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifenews-auto-rewrite
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Process one queued article
        env:
          REWRITE_SECRET: ${{ secrets.LIFENEWS_REWRITE_CRON_SECRET }}
        run: |
          if [ -z "$REWRITE_SECRET" ]; then
            echo "Missing repository secret: LIFENEWS_REWRITE_CRON_SECRET"
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 55 \
            -H "Authorization: Bearer $REWRITE_SECRET" \
            "https://lifenews.vercel.app/api/cron/rewrite"
