name: Debug Source Categories

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/debug-source-categories.mjs'
      - 'src/source-category.mjs'
      - 'src/ingest.mjs'
      - 'scripts/test-source-categories.mjs'
      - '.github/workflows/debug-source-categories.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Run source category unit tests
        run: |
          node --check src/source-category.mjs
          node --check src/ingest.mjs
          node scripts/test-source-categories.mjs

      - name: Validate ingestion syntax
        run: node --check src/ingest.mjs

      - name: Diagnose all news sources
        run: node scripts/debug-source-categories.mjs
