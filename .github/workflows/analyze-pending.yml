
name: Analyze Pending News

on:
  push:
    branches:
      - main
    paths:
      - 'src/analyze-pending.mjs'
      - 'src/source-category.mjs'
      - 'src/isna-rss-feeds.mjs'
      - '.github/run-live-category-backfill'
      - '.github/workflows/analyze-pending.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'اجرای آزمایشی بدون تغییر دیتابیس'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: analyze-pending
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Analyze pending articles
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DRY_RUN: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[live-category-backfill]') && 'false' || inputs.dry_run }}
        run: node src/analyze-pending.mjs
